  <!-- Script per rilevare lingua/paese e impostare GTranslate dinamicamente -->
  <script>
    // Mappa paese (ISO 3166-1 alpha-2) → lingua preferita (ISO 639-1)
    const countryToLanguage = {
      'IT': 'it', 'FR': 'fr', 'ES': 'es', 'DE': 'de', 'PT': 'pt',
      'GR': 'el', 'NL': 'nl', 'IS': 'is', 'NO': 'no', 'SE': 'sv',
      'DK': 'da', 'FI': 'fi', 'BG': 'bg', 'EE': 'et', 'LV': 'lv',
      'LT': 'lt', 'RO': 'ro'
      // Aggiungi altri se necessario, es. 'BR':'pt', 'MX':'es'
    };
    function setGTranslateLanguage() {
      const supported = ["en","fr","it","es","de","pt","el","ne","nl","is","no","sv","da","fi","bg","et","lv","lt","ro"];
      // 1. Priorità: lingua del browser (veloce e preciso)
      let lang = navigator.language?.split('-')[0]?.toLowerCase();
      if (supported.includes(lang)) {
        applySettings(lang);
        return;
      }
      // 2. Fallback: geolocalizzazione IP
      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(data => {
          const cc = data.country_code?.toUpperCase();
          lang = countryToLanguage[cc] || 'en';
          applySettings(lang);
        })
        .catch(() => applySettings('en')); // fallback finale
    }
    function applySettings(defaultLang) {
      window.gtranslateSettings = {
        "default_language": defaultLang,
        "native_language_names": true,
        "languages": ["en","fr","it","es","de","pt","el","ne","nl","is","no","sv","da","fi","bg","et","lv","lt","ro"],
        "wrapper_selector": ".gtranslate_wrapper"
      };
      const script = document.createElement('script');
      script.src = 'https://cdn.gtranslate.net/widgets/latest/dwf.js';
      script.defer = true;
      document.head.appendChild(script);
    }
    // Esegui all'onload per non bloccare rendering
    window.addEventListener('load', setGTranslateLanguage);
  </script>
